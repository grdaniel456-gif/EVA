<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Instituto Tecnológico Superior de Atlixco</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Iconos para el ojo de la contraseña -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <main class="login-card">
        <!-- Encabezado Rojo con Logo y Título -->
        <header class="card-header">
            <img src="logo-equipo.png" alt="Logo ITSA" class="logo">
            <h1 class="header-title">Instituto Tecnológico Superior de Atlixco</h1>
        </header>

        <!-- Formulario -->
        <form class="card-body" action="#" method="POST">
            <h2>Iniciar Sesión</h2>

            <div class="input-group">
                <label for="matricula">Matrícula:</label>
                <input type="text" id="matricula" name="matricula" value="ii231841" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" value="123" required>
                    <i class="fa-regular fa-eye toggle-password" id="toggleIcon"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

            <div class="card-footer">
                <p>¿No tienes cuenta? <a href="/crear.html">Solicitar registro</a></p>
            </div>
        </form>
    </main>

    <script>
        // Funcionalidad opcional para mostrar/ocultar contraseña al dar clic en el ojo
        const toggleIcon = document.getElementById('toggleIcon');
        const passwordInput = document.getElementById('password');

        toggleIcon.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
