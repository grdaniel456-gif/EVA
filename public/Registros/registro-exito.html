<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Concluido - EVA ITSA</title>
    <link rel="stylesheet" href="registros.css">
</head>
<body>
    <main class="login-card success-card">
        <header class="card-header">
            <img src="/Logo-Escuela.png" alt="Logo ITSA" class="logo">
            <h1 class="header-title">Instituto Tecnológico Superior de Atlixco</h1>
        </header>

        <section class="card-body success-body">
            <!-- Icono animado de check -->
            <div class="success-icon-wrapper">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>

            <h2>¡Registro Concluido con Éxito!</h2>
            <p class="success-message">
                Tu cuenta de estudiante ha sido creada correctamente. Ya puedes acceder al sistema para consultar tu información académica.
            </p>

            <a href="/index.html" class="btn-submit btn-success-link">Iniciar Sesión</a>
        </section>

        <footer class="card-footer">
            <p>Plataforma Académica EVA ITSA</p>
        </footer>
    </main>
</body>
</html>
