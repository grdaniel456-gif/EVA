<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Asistencias</title>
    <link rel="stylesheet" href="seguimiento.css">
</head>
<body>
    <div class="contenedor-seguimiento">
        <h2>Reporte de Asistencias por Alumno</h2>
        <div class="tabla-contenedor">
            <table id="tablaSeguimiento">
                <thead>
                    <tr id="filaEncabezado">
                        <th>Matrícula</th>
                        <th>Nombre del Alumno</th>
                        <!-- Las columnas de las fechas se generarán dinámicamente -->
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="seguimiento.js"></script>
</body>
</html>
